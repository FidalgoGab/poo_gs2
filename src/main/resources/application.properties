spring.application.name=territory-predictive-insights-fev

# Auxilio de IA na decisão: H2 em arquivo (./data) pra o histórico não sumir quando reinicia o app.
spring.datasource.url=jdbc:h2:file:./data/territorydb;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.main.banner-mode=off
logging.level.root=WARN
spring.jpa.show-sql=false
